packages:
  - server
  - client
  - shared

overrides:
  proxy-addr: ">=2.0.8"
  follow-redirects: ">=1.16.1"
  source-map-js: ">=1.2.2"
  http-cache-semantics: ">=4.3.0"
  "@grpc/grpc-js": ">=1.14.5"
  "brace-expansion@^1": "1.1.21"
  "brace-expansion@^2": "2.1.7"
  "brace-expansion@^5": "5.0.12"
  "brace-expansion@5.0.9": "5.0.12"
  "undici@6": ">=6.28.1"
  "undici@7": ">=7.29.1"

# electron-builder resolves versioned production dependencies from pnpm's
# virtual store. Hoisted layouts can select an unrelated root dev dependency.
nodeLinker: isolated
# Keep the node_modules layout identical in local shells and CI.
enableGlobalVirtualStore: false
engineStrict: true
strictDepBuilds: true
allowBuilds:
  electron-winstaller: true
  esbuild: true
  protobufjs: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  # Fastify 5.12.2 is a security release for request-validation bypasses.
  - fastify@5.12.2
trustPolicy: no-downgrade
trustPolicyIgnoreAfter: 10080

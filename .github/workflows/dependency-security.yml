name: Dependency Security

on:
  pull_request:
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - server/package.json
      - client/package.json
      - shared/package.json
      - scripts/check-dependency-audit.mjs
      - scripts/check-dependency-audit.test.mjs
      - .github/workflows/dependency-security.yml
  push:
    branches: [main]
    paths:
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - server/package.json
      - client/package.json
      - shared/package.json
      - scripts/check-dependency-audit.mjs
      - scripts/check-dependency-audit.test.mjs
      - .github/workflows/dependency-security.yml
  schedule:
    - cron: "37 1 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Test audit policy
        run: pnpm test:audit-policy

      - name: Audit vulnerabilities
        run: pnpm security:audit

      - name: Verify registry signatures
        run: pnpm security:signatures

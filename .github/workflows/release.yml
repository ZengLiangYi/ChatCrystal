name: Build & Release

on:
  push:
    tags:
      - 'v*'           # Full release (npm + Electron)
      - 'npm-v*'       # npm only
      - 'electron-v*'  # Electron only
  workflow_dispatch:
    inputs:
      publish_npm:
        description: 'Publish to npm'
        required: true
        type: boolean
        default: false
      npm_version:
        description: 'npm version override (leave empty to use server/package.json)'
        required: false
        type: string
      build_electron:
        description: 'Build Electron installer & GitHub Release'
        required: true
        type: boolean
        default: false
      electron_version:
        description: 'Electron version override (leave empty to use package.json)'
        required: false
        type: string
      release_tag:
        description: 'GitHub Release tag override for manual Electron recovery'
        required: false
        type: string

jobs:
  # ── Determine what to build ────────────────────────────────
  prepare:
    runs-on: ubuntu-latest
    outputs:
      do_npm: ${{ steps.resolve.outputs.do_npm }}
      do_electron: ${{ steps.resolve.outputs.do_electron }}
      npm_version: ${{ steps.resolve.outputs.npm_version }}
      electron_version: ${{ steps.resolve.outputs.electron_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          package-manager-cache: false

      - id: resolve
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_PUBLISH_NPM: ${{ inputs.publish_npm }}
          INPUT_NPM_VERSION: ${{ inputs.npm_version }}
          INPUT_BUILD_ELECTRON: ${{ inputs.build_electron }}
          INPUT_ELECTRON_VERSION: ${{ inputs.electron_version }}
        run: |
          npm_version=""
          electron_version=""

          if [[ "$EVENT_NAME" == "push" ]]; then
            TAG="$REF_NAME"
            if [[ "$TAG" == npm-v* ]]; then
              do_npm=true
              do_electron=false
              npm_version="${TAG#npm-v}"
            elif [[ "$TAG" == electron-v* ]]; then
              do_npm=false
              do_electron=true
              electron_version="${TAG#electron-v}"
            else
              do_npm=true
              do_electron=true
              npm_version="$(node -p "require('./server/package.json').version")"
              electron_version="${TAG#v}"
            fi
          else
            do_npm="$INPUT_PUBLISH_NPM"
            do_electron="$INPUT_BUILD_ELECTRON"

            if [[ -n "$INPUT_NPM_VERSION" ]]; then
              npm_version="$INPUT_NPM_VERSION"
            else
              npm_version="$(node -p "require('./server/package.json').version")"
            fi

            if [[ -n "$INPUT_ELECTRON_VERSION" ]]; then
              electron_version="$INPUT_ELECTRON_VERSION"
            else
              electron_version="$(node -p "require('./package.json').version")"
            fi
          fi

          semver_pattern='^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$'
          if [[ "$do_npm" == "true" && ! "$npm_version" =~ $semver_pattern ]]; then
            echo "Invalid npm version: $npm_version" >&2
            exit 1
          fi
          if [[ "$do_electron" == "true" && ! "$electron_version" =~ $semver_pattern ]]; then
            echo "Invalid Electron version: $electron_version" >&2
            exit 1
          fi

          {
            printf 'do_npm=%s\n' "$do_npm"
            printf 'do_electron=%s\n' "$do_electron"
            printf 'npm_version=%s\n' "$npm_version"
            printf 'electron_version=%s\n' "$electron_version"
          } >> "$GITHUB_OUTPUT"

  # ── Publish to npm (Trusted Publisher via OIDC) ────────────
  publish-npm:
    needs: prepare
    if: needs.prepare.outputs.do_npm == 'true'
    runs-on: ubuntu-latest
    environment: npm-publish
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Dependency security
        run: |
          pnpm security:audit
          pnpm security:signatures

      - name: Build server
        run: pnpm --filter ./server build

      - name: Sync npm package version
        working-directory: server
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.npm_version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const packagePath = 'package.json';
          const packageManifest = JSON.parse(readFileSync(packagePath, 'utf8'));
          packageManifest.version = process.env.RELEASE_VERSION;
          writeFileSync(packagePath, `${JSON.stringify(packageManifest, null, 2)}\n`);

          const path = 'server.json';
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          manifest.version = process.env.RELEASE_VERSION;
          for (const pkg of manifest.packages ?? []) {
            if (pkg.registryType === 'npm' && pkg.identifier === 'chatcrystal') {
              pkg.version = process.env.RELEASE_VERSION;
            }
          }
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Smoke test MCP server
        run: pnpm --filter ./server smoke:mcp

      - name: Validate npm package contents
        run: pnpm --filter ./server check:npm-package

      - name: Publish to npm
        working-directory: server
        run: npm publish --provenance --access public

  # ── Build Electron + GitHub Release ────────────────────────
  publish-electron:
    needs: prepare
    if: needs.prepare.outputs.do_electron == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v6
        with:
          node-version: 24.20.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Resolve Electron cache keys
        id: electron_cache
        shell: bash
        run: |
          ELECTRON_VERSION=$(node -p "require('./package.json').devDependencies.electron")
          echo "version=${ELECTRON_VERSION}" >> "$GITHUB_OUTPUT"
          echo "binary_key=electron-${{ runner.os }}-x64-v${ELECTRON_VERSION}" >> "$GITHUB_OUTPUT"
          echo "builder_key=electron-builder-${{ runner.os }}-${{ hashFiles('electron-builder.yml') }}" >> "$GITHUB_OUTPUT"

      # Cache Electron binary (~90MB) by Electron version, not by the whole lockfile.
      - name: Restore Electron binary cache
        id: electron_binary_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: ${{ steps.electron_cache.outputs.binary_key }}
          restore-keys: |
            electron-${{ runner.os }}-x64-
            electron-${{ runner.os }}-

      # Cache electron-builder tools (NSIS, nsis-resources, etc.)
      - name: Restore electron-builder tools cache
        id: electron_builder_cache
        uses: actions/cache/restore@v5
        with:
          path: ${{ github.workspace }}/.cache/electron-builder
          key: ${{ steps.electron_cache.outputs.builder_key }}
          restore-keys: |
            electron-builder-${{ runner.os }}-

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Dependency security
        run: |
          pnpm security:audit
          pnpm security:signatures

      - name: Build application
        run: |
          pnpm build
          pnpm exec tsc -p electron/tsconfig.json

      - name: Sync Electron version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.electron_version }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';

          const path = 'package.json';
          const manifest = JSON.parse(readFileSync(path, 'utf8'));
          manifest.version = process.env.RELEASE_VERSION;
          writeFileSync(path, `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Smoke test MCP server
        run: pnpm --filter ./server smoke:mcp

      - name: Package Electron app
        shell: bash
        run: |
          for attempt in 1 2 3; do
            if pnpm exec electron-builder --win --publish never; then
              exit 0
            fi

            status=$?
            if [ "$attempt" -eq 3 ]; then
              exit "$status"
            fi

            sleep_seconds=$((attempt * 45))
            echo "::warning::Electron packaging failed on attempt ${attempt}/3. Retrying in ${sleep_seconds}s."
            sleep "$sleep_seconds"
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Save Electron binary cache
        if: steps.electron_binary_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.cache/electron
          key: ${{ steps.electron_cache.outputs.binary_key }}

      - name: Save electron-builder tools cache
        if: steps.electron_builder_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: ${{ github.workspace }}/.cache/electron-builder
          key: ${{ steps.electron_cache.outputs.builder_key }}

      - name: Extract changelog
        id: changelog
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.prepare.outputs.electron_version }}
        run: |
          # Extract the section for this version from CHANGELOG.md
          BODY=$(awk -v heading="## [$RELEASE_VERSION]" 'index($0, heading) == 1 {found=1; next} /^## \[/ {if(found) exit} found {print}' CHANGELOG.md)
          if [ -z "$BODY" ]; then
            BODY="Release v${RELEASE_VERSION}"
          fi
          # Write to file to avoid escaping issues
          echo "$BODY" > release_body.md

      - name: Determine release tag
        id: release_tag
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
          ELECTRON_VERSION: ${{ needs.prepare.outputs.electron_version }}
        run: |
          # Use the original push tag if available (v* for full release),
          # otherwise fall back to electron-v* prefix
          if [[ "$EVENT_NAME" != "push" && -n "$INPUT_RELEASE_TAG" ]]; then
            tag="$INPUT_RELEASE_TAG"
          elif [[ "$REF_NAME" == v* ]]; then
            tag="$REF_NAME"
          else
            tag="electron-v${ELECTRON_VERSION}"
          fi

          if [[ ! "$tag" =~ ^[0-9A-Za-z._/-]+$ ]]; then
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: ChatCrystal v${{ needs.prepare.outputs.electron_version }}
          body_path: release_body.md
          draft: false
          prerelease: ${{ contains(needs.prepare.outputs.electron_version, '-') }}
          files: |
            release/*.exe
            release/*.yml
            release/*.yaml
